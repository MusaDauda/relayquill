name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  workspace-gates:
    name: Node 24.16.0 Workspace Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check repository hygiene
        run: npm run hygiene

      - name: Verify workspace import boundaries
        run: npm run boundaries

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Lint workspaces and tools
        run: npm run lint

      - name: Build workspaces
        run: npm run build

      - name: Run unit, tooling, and workspace tests
        run: npm test

      - name: Run PGlite SQL and privilege-manifest contract tests
        run: node --test "tests/contracts/*.test.mjs"

  broker-launcher:
    name: Go 1.27 Broker Launcher
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/broker-launcher
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: tools/broker-launcher/go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run Go race-enabled broker tests
        run: go test -race -count=1 ./...

  sdk-pack:
    name: SDK Tarball Packing & Consumer Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Pack standalone SDK tarballs and run isolated consumer check
        run: node tools/pack-sdks.mjs

  infra-validation:
    name: Compose & Kubernetes Manifest Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Docker Compose development and production topologies
        run: |
          docker compose -f infra/compose.dev.yaml config --quiet
          docker compose -f infra/compose.prod.yaml config --quiet

      - name: Validate Kustomize overlays and cluster security invariants
        run: |
          kubectl kustomize infra/kubernetes/base > /dev/null
          kubectl kustomize infra/kubernetes/receiver > /dev/null
          kubectl kustomize infra/kubernetes/ingress > /dev/null
          kubectl kustomize infra/kubernetes/overlays/selfhosted > /dev/null
          kubectl kustomize infra/kubernetes/overlays/eks > /dev/null
          node tools/cluster/validate-rendered.mjs

  e2e:
    name: Playwright & PGlite E2E Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: "npm"

      - name: Setup Go 1.27 for embedded broker harness
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: tools/broker-launcher/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E harness smoke checks
        run: node tests/e2e/run.mjs --suite harness

      - name: Run Playwright and PGlite E2E suite
        run: node tests/e2e/run.mjs
