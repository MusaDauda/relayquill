name: relayquill-dev

services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: relayquill
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55005:5432"
    volumes:
      - relayquill_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d relayquill"]
      interval: 3s
      timeout: 2s
      retries: 20

  broker:
    image: nats:2-alpine
    command: ["-c", "/etc/nats/development.conf"]
    ports:
      - "127.0.0.1:14225:4222"
      - "127.0.0.1:18225:8222"
    volumes:
      - ./broker/development.conf:/etc/nats/development.conf:ro
      - relayquill_jetstream:/data/jetstream
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:14317:4317"
      - "127.0.0.1:14318:4318"
    volumes:
      - ./otel/collector-dev.yaml:/etc/otelcol-contrib/config.yaml:ro

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:5379:6379"
    volumes:
      - relayquill_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  stripe-mock:
    image: stripe/stripe-mock:v0.194.0
    ports:
      - "127.0.0.1:5111:12111"

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:5025:1025"
      - "127.0.0.1:5825:8025"

volumes:
  relayquill_pg18:
  relayquill_jetstream:
  relayquill_redis:
