apiVersion: apps/v1
kind: Deployment
metadata:
  name: relayquill-fanout
  namespace: relayquill-app
  labels:
    app.kubernetes.io/name: relayquill-fanout
    app.kubernetes.io/component: fanout
    app.kubernetes.io/part-of: relayquill
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: relayquill-fanout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relayquill-fanout
        app.kubernetes.io/component: fanout
        app.kubernetes.io/part-of: relayquill
    spec:
      serviceAccountName: relayquill-fanout
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 80
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fanout
          image: relayquill/application:latest
          imagePullPolicy: IfNotPresent
          args:
            - fanout
            - --config
            - /etc/relayquill/config/fanout.json
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          env:
            - name: RELAYQUILL_ENV
              value: prod
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: config
              mountPath: /etc/relayquill/config
              readOnly: true
            - name: certs
              mountPath: /etc/relayquill/certs
              readOnly: true
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: relayquill-role-configs
            items:
              - key: fanout.json
                path: fanout.json
        - name: certs
          configMap:
            name: relayquill-ca-bundles
        - name: secrets
          secret:
            secretName: relayquill-fanout-secrets
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
