apiVersion: v1
kind: Service
metadata:
  name: relayquill-api
  namespace: relayquill-app
  labels:
    app.kubernetes.io/name: relayquill-api
    app.kubernetes.io/part-of: relayquill
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: relayquill-api
  ports:
    - name: http
      port: 8005
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: relayquill-console
  namespace: relayquill-app
  labels:
    app.kubernetes.io/name: relayquill-console
    app.kubernetes.io/part-of: relayquill
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: relayquill-console
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
