# Non-auto-running reviewed migration Job templates.
# Apply explicitly during controlled release/upgrade windows after setting exact image digest.
apiVersion: batch/v1
kind: Job
metadata:
  name: relayquill-migrate-rq
  namespace: relayquill-app
  labels:
    app.kubernetes.io/name: relayquill-migrator
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: relayquill
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relayquill-migrator
        app.kubernetes.io/component: migration
    spec:
      serviceAccountName: relayquill-migrator
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: relayquill/application:latest
          args:
            - admin
            - --config
            - /etc/relayquill/config/admin.json
            - db
            - migrate
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/relayquill/config
              readOnly: true
            - name: certs
              mountPath: /etc/relayquill/certs
              readOnly: true
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: relayquill-role-configs
            items:
              - key: admin.json
                path: admin.json
        - name: certs
          configMap:
            name: relayquill-ca-bundles
        - name: secrets
          secret:
            secretName: relayquill-migrator-secrets
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
