apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relayquill-public-alb
  namespace: relayquill-app
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=120,routing.http.drop_invalid_header_fields.enabled=true
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  ingressClassName: alb
  rules:
    - host: console.relayquill.example
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: relayquill-api
                port:
                  number: 8005
          - path: /
            pathType: Prefix
            backend:
              service:
                name: relayquill-console
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relayquill-receiver-alb
  namespace: relayquill-receiver
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /health/ready
spec:
  ingressClassName: alb
  rules:
    - host: receiver.relayquill.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: relayquill-receiver
                port:
                  number: 19095
---
apiVersion: networking.k8s.io/v1
