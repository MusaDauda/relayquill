# EKS overlay network egress rules for RDS PostgreSQL 18 (5432), private NATS broker quorum (4222),
# and EKS Pod Identity agent / VPC PrivateLink endpoints (replace CIDR blocks with exact VPC CIDRs).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-eks-db-and-pod-identity-egress
  namespace: relayquill-app
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.42.128.0/17
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - protocol: TCP
          port: 80
    - to:
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-eks-broker-egress
  namespace: relayquill-app
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - relayquill-relay
          - relayquill-fanout
          - relayquill-migrator
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.42.128.0/17
      ports:
        - protocol: TCP
          port: 4222
---
