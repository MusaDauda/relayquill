apiVersion: v1
kind: ConfigMap
metadata:
  name: relayquill-broker-topology
  namespace: relayquill-data
data:
  topology.json: |
    {
      "schema_version": 1,
      "server_name": "relayquill-broker",
      "host": "0.0.0.0",
      "client_port": 4222,
      "max_payload": 8192,
      "max_connections": 1024,
      "monitoring": {
        "enabled": true,
        "host": "0.0.0.0",
        "port": 8222
      },
      "tls": {
        "enabled": true,
        "handshake_first": true,
        "min_version": "1.2",
        "verify_client_cert": false,
        "cert_ref": "file:/etc/relayquill/certs/server/tls.crt",
        "key_ref": "file:/run/secrets/broker/server.key",
        "ca_ref": "file:/etc/relayquill/certs/server/ca.crt"
      },
      "cluster": {
        "enabled": true,
        "name": "relayquill-jetstream",
        "host": "0.0.0.0",
        "port": 6222,
        "routes": [
          "nats://relayquill-broker-0.relayquill-broker-headless.relayquill-data.svc.cluster.local:6222",
          "nats://relayquill-broker-1.relayquill-broker-headless.relayquill-data.svc.cluster.local:6222",
          "nats://relayquill-broker-2.relayquill-broker-headless.relayquill-data.svc.cluster.local:6222"
        ],
        "allowed_route_peers": [
          "relayquill-broker-0.relayquill-broker-headless.relayquill-data.svc.cluster.local",
          "relayquill-broker-1.relayquill-broker-headless.relayquill-data.svc.cluster.local",
          "relayquill-broker-2.relayquill-broker-headless.relayquill-data.svc.cluster.local"
        ],
        "tls": {
          "min_version": "1.2",
          "ca_ref": "file:/etc/relayquill/certs/route/ca.crt",
          "cert_ref": "file:/etc/relayquill/certs/route/tls.crt",
          "key_ref": "file:/run/secrets/broker/route.key"
        }
      },
      "nodes": [
        {
          "id": "relayquill-broker-0",
          "server_name": "relayquill-broker-0",
          "host": "0.0.0.0",
          "client_port": 4222,
          "client_advertise": "relayquill-broker-0.relayquill-broker-headless.relayquill-data.svc.cluster.local:4222",
          "cluster_host": "0.0.0.0",
          "cluster_port": 6222,
          "cluster_advertise": "relayquill-broker-0.relayquill-broker-headless.relayquill-data.svc.cluster.local:6222",
          "monitor_host": "0.0.0.0",
          "monitor_port": 8222,
          "store_dir": "/data/jetstream",
          "tls_cert_ref": "file:/etc/relayquill/certs/server/tls.crt",
          "tls_key_ref": "file:/run/secrets/broker/server.key",
          "tls_ca_ref": "file:/etc/relayquill/certs/server/ca.crt",
          "cluster_ca_ref": "file:/etc/relayquill/certs/route/ca.crt",
          "cluster_cert_ref": "file:/etc/relayquill/certs/route/tls.crt",
          "cluster_key_ref": "file:/run/secrets/broker/route.key"
        },
        {
          "id": "relayquill-broker-1",
          "server_name": "relayquill-broker-1",
          "host": "0.0.0.0",
          "client_port": 4222,
          "client_advertise": "relayquill-broker-1.relayquill-broker-headless.relayquill-data.svc.cluster.local:4222",
          "cluster_host": "0.0.0.0",
          "cluster_port": 6222,
          "cluster_advertise": "relayquill-broker-1.relayquill-broker-headless.relayquill-data.svc.cluster.local:6222",
          "monitor_host": "0.0.0.0",
          "monitor_port": 8222,
          "store_dir": "/data/jetstream",
          "tls_cert_ref": "file:/etc/relayquill/certs/server/tls.crt",
          "tls_key_ref": "file:/run/secrets/broker/server.key",
          "tls_ca_ref": "file:/etc/relayquill/certs/server/ca.crt",
          "cluster_ca_ref": "file:/etc/relayquill/certs/route/ca.crt",
          "cluster_cert_ref": "file:/etc/relayquill/certs/route/tls.crt",
          "cluster_key_ref": "file:/run/secrets/broker/route.key"
        },
        {
          "id": "relayquill-broker-2",
          "server_name": "relayquill-broker-2",
          "host": "0.0.0.0",
          "client_port": 4222,
          "client_advertise": "relayquill-broker-2.relayquill-broker-headless.relayquill-data.svc.cluster.local:4222",
          "cluster_host": "0.0.0.0",
          "cluster_port": 6222,
          "cluster_advertise": "relayquill-broker-2.relayquill-broker-headless.relayquill-data.svc.cluster.local:6222",
          "monitor_host": "0.0.0.0",
          "monitor_port": 8222,
          "store_dir": "/data/jetstream",
          "tls_cert_ref": "file:/etc/relayquill/certs/server/tls.crt",
          "tls_key_ref": "file:/run/secrets/broker/server.key",
          "tls_ca_ref": "file:/etc/relayquill/certs/server/ca.crt",
          "cluster_ca_ref": "file:/etc/relayquill/certs/route/ca.crt",
          "cluster_cert_ref": "file:/etc/relayquill/certs/route/tls.crt",
          "cluster_key_ref": "file:/run/secrets/broker/route.key"
        }
      ],
      "jetstream": {
        "enabled": true,
        "store_dir": "/data/jetstream",
        "max_memory_store": 268435456,
        "max_file_store": 21474836480,
        "sync_interval": "always",
        "stream_name": "RELAYQUILL_EVENTS_V1",
        "consumer_name": "RELAYQUILL_FANOUT_V1",
        "subject_prefix": ""
      },
      "principals": {
        "relay": {
          "public_nkey_ref": "file:/etc/relayquill/broker-keys/relay.pub",
          "inbox_prefix": "_INBOX.rq.relay",
          "publish_allow": ["rq.events.*.accepted"],
          "subscribe_allow": ["_INBOX.rq.relay.>"]
        },
        "fanout": {
          "public_nkey_ref": "file:/etc/relayquill/broker-keys/fanout.pub",
          "inbox_prefix": "_INBOX.rq.fanout",
          "publish_allow": [
            "$JS.API.STREAM.INFO.RELAYQUILL_EVENTS_V1",
            "$JS.API.CONSUMER.INFO.RELAYQUILL_EVENTS_V1.RELAYQUILL_FANOUT_V1",
            "$JS.API.CONSUMER.MSG.NEXT.RELAYQUILL_EVENTS_V1.RELAYQUILL_FANOUT_V1",
            "$JS.ACK.RELAYQUILL_EVENTS_V1.RELAYQUILL_FANOUT_V1.>",
            "$JS.ACK.*.*.RELAYQUILL_EVENTS_V1.RELAYQUILL_FANOUT_V1.>"
          ],
          "subscribe_allow": ["_INBOX.rq.fanout.>"]
        },
        "broker_admin": {
          "public_nkey_ref": "file:/etc/relayquill/broker-keys/admin.pub",
          "inbox_prefix": "_INBOX.rq.admin",
          "publish_allow": [
            "$JS.API.INFO",
            "$JS.API.STREAM.INFO.RELAYQUILL_EVENTS_V1",
            "$JS.API.STREAM.CREATE.RELAYQUILL_EVENTS_V1",
            "$JS.API.STREAM.UPDATE.RELAYQUILL_EVENTS_V1",
            "$JS.API.CONSUMER.INFO.RELAYQUILL_EVENTS_V1.RELAYQUILL_FANOUT_V1",
            "$JS.API.CONSUMER.CREATE.RELAYQUILL_EVENTS_V1.RELAYQUILL_FANOUT_V1",
            "$JS.API.CONSUMER.CREATE.RELAYQUILL_EVENTS_V1.RELAYQUILL_FANOUT_V1.>"
          ],
          "subscribe_allow": ["_INBOX.rq.admin.>"]
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: relayquill-broker-headless
  namespace: relayquill-data
  labels:
    app.kubernetes.io/name: relayquill-broker
    app.kubernetes.io/part-of: relayquill
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: relayquill-broker
  ports:
    - name: client
      port: 4222
      targetPort: client
      protocol: TCP
    - name: route
      port: 6222
      targetPort: route
      protocol: TCP
    - name: monitor
      port: 8222
      targetPort: monitor
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: relayquill-broker
  namespace: relayquill-data
  labels:
    app.kubernetes.io/name: relayquill-broker
    app.kubernetes.io/part-of: relayquill
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: relayquill-broker
  ports:
    - name: client
      port: 4222
      targetPort: client
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: relayquill-broker
  namespace: relayquill-data
  labels:
    app.kubernetes.io/name: relayquill-broker
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: relayquill
spec:
  serviceName: relayquill-broker-headless
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: relayquill-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relayquill-broker
        app.kubernetes.io/component: broker
        app.kubernetes.io/part-of: relayquill
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: relayquill-broker
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: relayquill-broker
      containers:
        - name: broker
          image: relayquill/broker:latest
          imagePullPolicy: IfNotPresent
          args:
            - --topology
            - /etc/relayquill/broker/topology.json
          env:
            - name: RELAYQUILL_BROKER_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: client
              containerPort: 4222
              protocol: TCP
            - name: route
              containerPort: 6222
              protocol: TCP
            - name: monitor
              containerPort: 8222
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: monitor
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: topology
              mountPath: /etc/relayquill/broker
              readOnly: true
            - name: broker-public-keys
              mountPath: /etc/relayquill/broker-keys
              readOnly: true
            - name: server-tls
              mountPath: /etc/relayquill/certs/server
              readOnly: true
            - name: route-tls
              mountPath: /etc/relayquill/certs/route
              readOnly: true
            - name: broker-keys
              mountPath: /run/secrets/broker
              readOnly: true
            - name: jetstream-data
              mountPath: /data/jetstream
      volumes:
        - name: topology
          configMap:
            name: relayquill-broker-topology
        - name: broker-public-keys
          configMap:
            name: relayquill-broker-public-nkeys
        - name: server-tls
          secret:
            secretName: relayquill-broker-server-tls
            defaultMode: 0440
        - name: route-tls
          secret:
            secretName: relayquill-broker-route-tls
            defaultMode: 0440
        - name: broker-keys
          secret:
            secretName: relayquill-broker-private-keys
            defaultMode: 0400
  volumeClaimTemplates:
    - metadata:
        name: jetstream-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 25Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: relayquill-broker
  namespace: relayquill-data
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: relayquill-broker
