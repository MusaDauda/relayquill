apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: relayquill-data
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: relayquill-data
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-ingress
  namespace: relayquill-data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: relayquill-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              relayquill.example/namespace: relayquill-app
        - namespaceSelector:
            matchLabels:
              relayquill.example/namespace: relayquill-receiver
        - namespaceSelector:
            matchLabels:
              relayquill.example/namespace: relayquill-ingress
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-broker-mesh-and-clients
  namespace: relayquill-data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: relayquill-broker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              relayquill.example/namespace: relayquill-app
          podSelector:
            matchLabels:
              app.kubernetes.io/name: relayquill-relay
        - namespaceSelector:
            matchLabels:
              relayquill.example/namespace: relayquill-app
          podSelector:
            matchLabels:
              app.kubernetes.io/name: relayquill-fanout
        - namespaceSelector:
            matchLabels:
              relayquill.example/namespace: relayquill-app
          podSelector:
            matchLabels:
              app.kubernetes.io/name: relayquill-migrator
      ports:
        - protocol: TCP
          port: 4222
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: relayquill-broker
      ports:
        - protocol: TCP
          port: 6222
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: relayquill-broker
      ports:
        - protocol: TCP
          port: 6222
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-postgres
  namespace: relayquill-app
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - relayquill-api
          - relayquill-relay
          - relayquill-fanout
          - relayquill-sender
          - relayquill-coordinator
          - relayquill-migrator
          - relayquill-recovery
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              relayquill.example/namespace: relayquill-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: relayquill-postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-broker-clients-egress
  namespace: relayquill-app
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - relayquill-relay
          - relayquill-fanout
          - relayquill-migrator
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              relayquill.example/namespace: relayquill-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: relayquill-broker
      ports:
        - protocol: TCP
          port: 4222
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-receiver-to-postgres
  namespace: relayquill-receiver
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              relayquill.example/namespace: relayquill-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: relayquill-postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-postgres
  namespace: relayquill-ingress
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              relayquill.example/namespace: relayquill-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: relayquill-postgres
      ports:
        - protocol: TCP
          port: 5432
