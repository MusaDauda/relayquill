apiVersion: v1
kind: ConfigMap
metadata:
  name: relayquill-pg-init
  namespace: relayquill-data
data:
  pg_hba.conf: |
    local   all             postgres                                peer
    hostssl all             all             0.0.0.0/0               scram-sha-256
    hostssl all             all             ::/0                    scram-sha-256
    host    all             all             0.0.0.0/0               reject
    host    all             all             ::/0                    reject
  00-bootstrap-selfhosted.sh: |
    #!/bin/sh
    set -eu

    read_secret_or_fail() {
      role_name="$1"
      secret_file="/run/secrets/pg/pg_password_${role_name}"
      if [ ! -r "$secret_file" ]; then
        echo "Missing readable secret file for PostgreSQL role ${role_name}: ${secret_file}" >&2
        exit 1
      fi
      tr -d '\r\n' < "$secret_file"
    }

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<'SQL'
    DO $$
    DECLARE r text;
    BEGIN
      FOREACH r IN ARRAY ARRAY['rq_owner', 'receiver_owner', 'provider_owner'] LOOP
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = r) THEN
          EXECUTE format('CREATE ROLE %I NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS', r);
        END IF;
      END LOOP;
      FOREACH r IN ARRAY ARRAY[
        'rq_api', 'rq_relay', 'rq_fanout', 'rq_sender', 'rq_coordinator',
        'rq_reporter', 'rq_signing_issuer', 'rq_migrator', 'rq_recovery',
        'receiver_migrator', 'receiver_runtime',
        'provider_migrator', 'provider_runtime'
      ] LOOP
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = r) THEN
          EXECUTE format('CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS', r);
        END IF;
      END LOOP;
    END
    $$;

    GRANT rq_owner TO rq_migrator;
    GRANT receiver_owner TO receiver_migrator;
    GRANT provider_owner TO provider_migrator;
    SQL

    for role_name in \
      rq_api rq_relay rq_fanout rq_sender rq_coordinator \
      rq_reporter rq_signing_issuer rq_migrator rq_recovery \
      receiver_migrator receiver_runtime \
      provider_migrator provider_runtime
    do
      pw="$(read_secret_or_fail "$role_name")"
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
        -v target_role="$role_name" -v target_pw="$pw" <<'SQL'
    SELECT format('ALTER ROLE %I WITH PASSWORD %L', :'target_role', :'target_pw') \gexec
    SQL
    done

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<'SQL'
    SELECT format('CREATE DATABASE %I OWNER %I', 'relayquill', 'rq_owner')
    WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'relayquill') \gexec
    ALTER DATABASE relayquill OWNER TO rq_owner;
    SELECT format('CREATE DATABASE %I OWNER %I', 'relayquill_receiver', 'receiver_owner')
    WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'relayquill_receiver') \gexec
    SELECT format('CREATE DATABASE %I OWNER %I', 'relayquill_provider', 'provider_owner')
    WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'relayquill_provider') \gexec
    REVOKE ALL ON DATABASE relayquill FROM PUBLIC;
    REVOKE ALL ON DATABASE relayquill_receiver FROM PUBLIC;
    REVOKE ALL ON DATABASE relayquill_provider FROM PUBLIC;
    GRANT CONNECT ON DATABASE relayquill TO
      rq_api, rq_relay, rq_fanout, rq_sender, rq_coordinator,
      rq_reporter, rq_signing_issuer, rq_migrator, rq_recovery;
    GRANT CONNECT ON DATABASE relayquill_receiver TO receiver_migrator, receiver_runtime;
    GRANT CONNECT ON DATABASE relayquill_provider TO provider_migrator, provider_runtime;
    SQL

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname relayquill <<'SQL'
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    CREATE SCHEMA IF NOT EXISTS rq AUTHORIZATION rq_owner;
    CREATE SCHEMA IF NOT EXISTS rq_support AUTHORIZATION rq_owner;
    CREATE SCHEMA IF NOT EXISTS rq_recovery AUTHORIZATION rq_owner;
    CREATE EXTENSION IF NOT EXISTS btree_gist WITH SCHEMA rq_support;
    SQL

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname relayquill_receiver <<'SQL'
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    CREATE SCHEMA IF NOT EXISTS rc AUTHORIZATION receiver_owner;
    SQL

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname relayquill_provider <<'SQL'
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    CREATE SCHEMA IF NOT EXISTS pi AUTHORIZATION provider_owner;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: relayquill-postgres
  namespace: relayquill-data
  labels:
    app.kubernetes.io/name: relayquill-postgres
    app.kubernetes.io/part-of: relayquill
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: relayquill-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: relayquill-postgres-headless
  namespace: relayquill-data
  labels:
    app.kubernetes.io/name: relayquill-postgres
    app.kubernetes.io/part-of: relayquill
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: relayquill-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: relayquill-postgres
  namespace: relayquill-data
  labels:
    app.kubernetes.io/name: relayquill-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: relayquill
spec:
  serviceName: relayquill-postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: relayquill-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relayquill-postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: relayquill
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-tls-key
          image: postgres:18-bookworm
          command:
            - sh
            - -ec
            - |
              cp /etc/postgres/tls-src/tls.crt /etc/postgres/tls/server.crt
              cp /etc/postgres/tls-src/tls.key /etc/postgres/tls/server.key
              cp /etc/postgres/tls-src/ca.crt /etc/postgres/tls/ca.crt
              chmod 0644 /etc/postgres/tls/server.crt /etc/postgres/tls/ca.crt
              chmod 0600 /etc/postgres/tls/server.key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tls-secret
              mountPath: /etc/postgres/tls-src
              readOnly: true
            - name: tls-runtime
              mountPath: /etc/postgres/tls
      containers:
        - name: postgres
          image: postgres:18-bookworm
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgres/tls/server.crt
            - -c
            - ssl_key_file=/etc/postgres/tls/server.key
            - -c
            - ssl_ca_file=/etc/postgres/tls/ca.crt
            - -c
            - ssl_min_protocol_version=TLSv1.2
            - -c
            - password_encryption=scram-sha-256
            - -c
            - hba_file=/etc/postgres/config/pg_hba.conf
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/pg/pg_superuser_password
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-host=scram-sha-256 --auth-local=peer"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "relayquill"]
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "relayquill"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "relayquill"]
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql
            - name: tls-runtime
              mountPath: /etc/postgres/tls
              readOnly: true
            - name: pg-init
              mountPath: /etc/postgres/config/pg_hba.conf
              subPath: pg_hba.conf
              readOnly: true
            - name: pg-init
              mountPath: /docker-entrypoint-initdb.d/00-bootstrap-selfhosted.sh
              subPath: 00-bootstrap-selfhosted.sh
              readOnly: true
            - name: pg-passwords
              mountPath: /run/secrets/pg
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: pg-run
              mountPath: /var/run/postgresql
      volumes:
        - name: pg-init
          configMap:
            name: relayquill-pg-init
            defaultMode: 0555
        - name: tls-secret
          secret:
            secretName: relayquill-pg-tls
            defaultMode: 0440
        - name: tls-runtime
          emptyDir:
            sizeLimit: 1Mi
        - name: pg-passwords
          secret:
            secretName: relayquill-pg-passwords
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: pg-run
          emptyDir:
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
