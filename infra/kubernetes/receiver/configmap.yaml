apiVersion: v1
kind: ConfigMap
metadata:
  name: relayquill-receiver-config
  namespace: relayquill-receiver
data:
  receiver.json: |
    {
      "schema_version": 1,
      "profile": "self_hosted",
      "process_role": "receiver",
      "http": {
        "host": "0.0.0.0",
        "port": 19095,
        "trust_proxy": true
      },
      "database": {
        "mode": "standard_tls",
        "isolation": "separate_databases",
        "host": "relayquill-postgres.relayquill-data.svc.cluster.local",
        "port": 5432,
        "name": "relayquill_receiver",
        "schema": "rc",
        "support_schema": "rq_support",
        "role": "receiver_runtime",
        "authentication": "secret_provider_password",
        "password_secret_ref": "file:/run/secrets/pg_password_receiver_runtime",
        "tls_mode": "verify_full",
        "tls_ca_file": "/etc/relayquill/certs/postgres-ca.pem",
        "pool_mode": "direct",
        "maximum_connections": 8,
        "connection_timeout_ms": 5000,
        "statement_timeout_ms": 5000,
        "lock_timeout_ms": 2000
      },
      "secret_provider": {
        "mode": "mounted_file",
        "secrets_dir": "/run/secrets"
      },
      "telemetry": {
        "enabled": true,
        "service_name": "relayquill-receiver",
        "max_queue_size": 2048,
        "max_export_batch_size": 256
      },
      "protocol": {
        "http_schema_version": 1,
        "broker_envelope_version": 1,
        "webhook_signature_version": 1
      }
    }
  receiver-migrator.json: |
    {
      "schema_version": 1,
      "profile": "self_hosted",
      "process_role": "receiver_migrator",
      "database": {
        "mode": "standard_tls",
        "isolation": "separate_databases",
        "host": "relayquill-postgres.relayquill-data.svc.cluster.local",
        "port": 5432,
        "name": "relayquill_receiver",
        "schema": "rc",
        "support_schema": "rq_support",
        "role": "receiver_migrator",
        "authentication": "secret_provider_password",
        "password_secret_ref": "file:/run/secrets/pg_password_receiver_migrator",
        "tls_mode": "verify_full",
        "tls_ca_file": "/etc/relayquill/certs/postgres-ca.pem",
        "pool_mode": "direct",
        "maximum_connections": 2,
        "connection_timeout_ms": 5000,
        "statement_timeout_ms": 30000,
        "lock_timeout_ms": 5000
      },
      "migrations_dir": "examples/receiver/migrations"
    }
