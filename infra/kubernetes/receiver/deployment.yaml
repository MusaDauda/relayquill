apiVersion: apps/v1
kind: Deployment
metadata:
  name: relayquill-receiver
  namespace: relayquill-receiver
  labels:
    app.kubernetes.io/name: relayquill-receiver
    app.kubernetes.io/component: receiver
    app.kubernetes.io/part-of: relayquill
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: relayquill-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relayquill-receiver
        app.kubernetes.io/component: receiver
        app.kubernetes.io/part-of: relayquill
    spec:
      serviceAccountName: relayquill-receiver
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: relayquill-receiver
      containers:
        - name: receiver
          image: relayquill/application:latest
          imagePullPolicy: IfNotPresent
          args:
            - receiver
            - --config
            - /etc/relayquill/config/receiver.json
            - serve
          ports:
            - name: http
              containerPort: 19095
              protocol: TCP
          env:
            - name: RELAYQUILL_ENV
              value: prod
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/relayquill/config
              readOnly: true
            - name: certs
              mountPath: /etc/relayquill/certs
              readOnly: true
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: relayquill-receiver-config
            items:
              - key: receiver.json
                path: receiver.json
        - name: certs
          configMap:
            name: relayquill-receiver-ca-bundles
        - name: secrets
          secret:
            secretName: relayquill-receiver-secrets
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: relayquill-receiver
  namespace: relayquill-receiver
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: relayquill-receiver
